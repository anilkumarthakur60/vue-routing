name: Dependabot auto-merge

# Auto-approves and enables auto-merge for Dependabot PRs that bump a patch or
# minor version. Major bumps are left open for manual review.
#
# Auto-merge waits for required status checks (CI), so enable branch protection
# on `main` requiring the CI checks, plus "Allow auto-merge" in repo settings.
#
# Uses `pull_request_target` so the workflow runs with a write-capable token.
# It never checks out PR code (only the GitHub CLI + metadata action), so this
# is safe.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge (patch & minor only)
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
